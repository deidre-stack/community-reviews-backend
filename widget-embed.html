<!-- ============================================================
Community rating & review widget - paste this exact snippet, unedited,
into the Sierra Interactive custom HTML block on EVERY community page.

Before pasting anywhere:
  1. Set API_BASE below to your deployed backend URL
     (e.g. "https://haven-reviews.onrender.com"). Set it once - it's
     the same value on every page.

That's it. Each page figures out its own community automatically from
its URL and its <h1> heading, so this same snippet works unchanged on
all 300+ community pages - nothing to fill in per page.

Submitted reviews will NOT appear immediately - they wait in the
moderation queue at /admin until approved.
============================================================ -->
<div id="hrt-reviews-widget" style="font-family:'Roboto', sans-serif;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <div>
      <div id="hrt-agg-stars" style="font-size:22px; color:#b7791f; letter-spacing:2px;"></div>
      <div id="hrt-agg-summary" style="font-size:13px; color:#666; margin-top:2px;"></div>
    </div>
  </div>

  <div id="hrt-approved-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;"></div>

  <div style="background:rgba(197,206,194,0.65); border:1px solid rgba(139,150,135,0.5); border-radius:12px; padding:16px 18px;">
    <p style="font-family:'Montserrat', sans-serif; font-size:16px; font-weight:600; margin:0 0 10px; color:#2c2c2a;">What would you tell someone moving here?</p>
    <div id="hrt-star-input" style="font-size:26px; color:#8b9687; letter-spacing:4px; margin-bottom:10px; cursor:pointer;"></div>
    <input id="hrt-reviewer-name" type="text" placeholder="Your name" style="width:100%; padding:8px 10px; margin-bottom:8px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-family:'Roboto', sans-serif;" />
    <textarea id="hrt-review-text" placeholder="What do you like about this community?" style="width:100%; min-height:64px; padding:8px 10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; resize:vertical; margin-bottom:10px; font-family:'Roboto', sans-serif;"></textarea>
    <input id="hrt-hp" type="text" name="website" autocomplete="off" tabindex="-1" style="position:absolute; left:-9999px;" />
    <button id="hrt-submit-review" style="padding:9px 18px; border-radius:6px; border:1px solid #8b9687; background:#C5CEC2; color:#2c2c2a; cursor:pointer; font-size:14px; font-family:'Montserrat', sans-serif; font-weight:600;">Submit review</button>
    <p id="hrt-confirm" style="font-size:13px; color:#2e7d32; margin:10px 0 0; display:none;">Thanks! Your review is awaiting approval before it appears here.</p>
    <p id="hrt-error" style="font-size:13px; color:#c62828; margin:10px 0 0; display:none;"></p>
  </div>
</div>

<script>
(function () {
  var API_BASE = 'https://community-reviews-backend.onrender.com';

  // Figures out which community this page is for, with no per-page setup:
  // - slug comes from the page URL (unique and stable even if two
  //   communities share a name under different areas, e.g.
  //   /edmonton/southwest/ -> "edmonton-southwest")
  // - display name comes from the page's own <h1>, falling back to the
  //   page title, falling back to a readable version of the slug
  function detectCommunity() {
    var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
    var slug = path
      .toLowerCase()
      .replace(/\//g, '-')
      .replace(/[^a-z0-9-]+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '') || 'home';

    var h1 = document.querySelector('h1');
    var name = h1 && h1.textContent.trim();
    if (!name) {
      name = document.title.split(/\s[-|]\s/)[0].trim();
    }
    if (!name) {
      name = slug.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }
    return { slug: slug, name: name };
  }

  var COMMUNITY = detectCommunity();
  var COMMUNITY_SLUG = COMMUNITY.slug;
  var COMMUNITY_NAME = COMMUNITY.name;

  var selectedRating = 0;

  function starString(n) {
    var full = Math.round(n);
    var s = '';
    for (var i = 0; i < 5; i++) s += (i < full ? '★' : '☆');
    return s;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function loadReviews() {
    fetch(API_BASE + '/api/reviews?community=' + encodeURIComponent(COMMUNITY_SLUG))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById('hrt-agg-stars').textContent = starString(data.average);
        document.getElementById('hrt-agg-summary').textContent = data.count
          ? data.average.toFixed(1) + ' from ' + data.count + ' review' + (data.count === 1 ? '' : 's')
          : 'No reviews yet - be the first';

        var list = document.getElementById('hrt-approved-list');
        list.innerHTML = '';
        data.reviews.forEach(function (r) {
          var row = document.createElement('div');
          row.style.cssText = 'border-top:1px solid #e2e2e2; padding-top:10px;';
          row.innerHTML =
            '<div style="display:flex; align-items:center; justify-content:space-between;">' +
              '<span style="font-size:14px; font-weight:600;">' + escapeHtml(r.name) + '</span>' +
              '<span style="font-size:14px; color:#b7791f; letter-spacing:1px;">' + starString(r.rating) + '</span>' +
            '</div>' +
            '<p style="font-size:14px; color:#444; margin:4px 0 0;">' + escapeHtml(r.text) + '</p>';
          list.appendChild(row);
        });
      })
      .catch(function () {
        document.getElementById('hrt-agg-summary').textContent = 'Reviews are temporarily unavailable.';
      });
  }

  function renderStarInput() {
    var el = document.getElementById('hrt-star-input');
    el.innerHTML = '';
    for (var i = 1; i <= 5; i++) {
      var s = document.createElement('span');
      s.textContent = i <= selectedRating ? '★' : '☆';
      s.style.marginRight = '2px';
      s.dataset.val = i;
      s.addEventListener('click', function () {
        selectedRating = parseInt(this.dataset.val, 10);
        renderStarInput();
      });
      el.appendChild(s);
    }
  }

  document.getElementById('hrt-submit-review').addEventListener('click', function () {
    var errorEl = document.getElementById('hrt-error');
    var confirmEl = document.getElementById('hrt-confirm');
    errorEl.style.display = 'none';
    confirmEl.style.display = 'none';

    var name = document.getElementById('hrt-reviewer-name').value.trim();
    var text = document.getElementById('hrt-review-text').value.trim();
    var hp = document.getElementById('hrt-hp').value;

    if (!selectedRating) { errorEl.textContent = 'Please choose a star rating.'; errorEl.style.display = 'block'; return; }
    if (!text) { errorEl.textContent = 'Please add a short review.'; errorEl.style.display = 'block'; return; }

    fetch(API_BASE + '/api/reviews', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        community: COMMUNITY_SLUG,
        communityName: COMMUNITY_NAME,
        name: name,
        rating: selectedRating,
        text: text,
        hp: hp,
      }),
    })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Something went wrong.'); });
        return r.json();
      })
      .then(function () {
        document.getElementById('hrt-reviewer-name').value = '';
        document.getElementById('hrt-review-text').value = '';
        selectedRating = 0;
        renderStarInput();
        confirmEl.style.display = 'block';
      })
      .catch(function (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      });
  });

  loadReviews();
  renderStarInput();
})();
</script>
